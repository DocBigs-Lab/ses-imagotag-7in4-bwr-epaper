; Entwicklungsumgebung fuer die Bibliothek: baut das Beispiel examples/Demo
; gegen die Bibliothek in diesem Repo.
; Board: Waveshare e-Paper ESP32 Driver Board (SKU 15823), Schalter 1 = B, 2 = ON
;
; Die Diagnosefirmware ist ein eigenes PlatformIO-Projekt in extras/diagnose/.

[platformio]
src_dir = examples/Demo

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=0
lib_deps =
    symlink://.
